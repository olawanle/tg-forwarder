[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.forwarder"

[deploy]
startCommand = "sh -c \"mkdir -p \\\"${FORWARDER_DATA_DIR:-/app/data}\\\" && exec streamlit run forwarder/app.py --server.port=${PORT:-8080} --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false\""
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 30
