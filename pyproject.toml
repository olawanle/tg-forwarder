[project]
name = "telegram-campaign-manager"
version = "0.1.0"
description = "Multi-tenant Telegram campaign manager with FastAPI, Aiogram, Telethon, PostgreSQL, Redis, and Docker."
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.7.0",
  "alembic>=1.13.0",
  "apscheduler>=3.10.4",
  "asyncpg>=0.29.0",
  "cryptography>=42.0.0",
  "fastapi>=0.111.0",
  "greenlet>=3.0.0",
  "httpx>=0.27.0",
  "passlib[bcrypt]>=1.7.4",
  "pydantic-settings>=2.2.1",
  "pyjwt>=2.8.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "redis>=5.0.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "telethon>=1.36.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = [
  "backend*",
  "bot*",
  "services*",
  "scheduler*",
  "telethon_client*"
]
exclude = [
  "frontend*",
  "database*",
  "docker*",
  "logs*",
  "templates*",
  "tests*"
]
